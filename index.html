<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Small Steps">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Small daily movement, mobility and meditation — with gentle real-world side quests.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="css/base.css">
<title>Small Steps</title>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  function showBootError(message){
    var root=document.getElementById('root');
    if(!root || window.__natureWalkBooted) return;
    root.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#101a40;color:#fff6dd;font-family:Courier New,monospace"><section style="width:min(100%,520px);padding:24px;border:2px solid #c99b3d;background:#152759;text-align:center"><h1 style="margin:0 0 12px;font-size:24px">Small Steps could not start</h1><p style="line-height:1.5;color:#dbe3ff">Please reopen this version. Your saved progress has not been deliberately reset.</p><button onclick="location.reload()" style="margin-top:10px;padding:12px 20px;border:2px solid #fff6dd;background:#376c8b;color:white;font:inherit;font-weight:bold">Reload</button></section></main>';
    try{console.error('Small Steps boot error:',message)}catch(_){}
  }
  window.addEventListener('error',function(e){showBootError(e && (e.message||e.error&&e.error.message) || 'Unknown error')});
  window.addEventListener('unhandledrejection',function(e){showBootError(e && e.reason && (e.reason.message||String(e.reason)) || 'Unhandled promise rejection')});
  window.__natureWalkShowBootError=showBootError;
})();
</script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('Small Steps offline support unavailable:', err); }); });
}
</script>
</body>
</html>
